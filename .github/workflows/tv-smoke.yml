name: TV smoke test

# Instrumented tests on an Android TV emulator. Manual: run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tv-smoke"
  cancel-in-progress: true

jobs:
  tv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run fork TV tests on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: tv_1080p
          script: ./gradlew :app:connectedStableDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.lagradost.cloudstream3.utils.ForkTvHelperInstrumentedTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tv-instrumented-test-results
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
