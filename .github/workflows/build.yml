name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: a stable, non-production debug key so successive CI APKs update in place.
      TIKTV_DEBUG_KEYSTORE_BASE64: ${{ secrets.TIKTV_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate fork invariants
        run: python3 scripts/validate_fork.py

      - name: Decode CI debug keystore
        if: ${{ env.TIKTV_DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/keystore"
          echo "${TIKTV_DEBUG_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore/tiktv-debug.p12"
          echo "TIKTV_DEBUG_STORE_FILE=${RUNNER_TEMP}/keystore/tiktv-debug.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleStableDebug 2>&1 | tee "$RUNNER_TEMP/assemble.log"

      # CI logs cannot be read from outside the runner here, so republish the failure.
      - name: Report build failure
        if: failure()
        run: python3 .github/annotate_log.py "$RUNNER_TEMP/assemble.log"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testStableDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-test.log"

      - name: Report test failure
        if: failure()
        run: python3 .github/annotate_log.py "$RUNNER_TEMP/unit-test.log"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktv-stable-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
