name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TikTV-${{ github.run_number }}.apk"
          # Stable filename so a TV can always fetch the newest build from
          # https://github.com/<owner>/<repo>/releases/latest/download/TikTV.apk
          cp app/build/outputs/apk/release/*.apk out/TikTV.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTV-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: TikTV build ${{ github.run_number }}
          body: |
            Sideload this APK on Android TV / Google TV (Downloader app or `adb install`).
            Stable link: `https://github.com/${{ github.repository }}/releases/latest/download/TikTV.apk`
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
